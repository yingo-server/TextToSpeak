name: 生成角色语音并发布（历史版本留存）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 打印系统信息
        run: |
          echo "=== 系统信息 ==="
          uname -a
          lscpu | grep -E "Model name|Socket|Core|Thread"
          free -h
          df -h .

      # ---------- APT 缓存 ----------
      - name: 缓存 APT 软件包
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-v2  # 更新版本号，因新增包

      - name: 安装系统依赖（含 FFmpeg 开发库）
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg git \
            libsndfile1 libsox-dev \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libavfilter-dev libswscale-dev libswresample-dev \
            pkg-config

      # ---------- Python 环境 ----------
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v2  # 更新版本号

      - name: 安装官方 RVC CLI（CPU 版）及 Edge TTS
        run: |
          echo "安装 CPU 版 PyTorch..."
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          echo "安装官方 RVC CLI..."
          pip install git+https://github.com/RVC-Project/Retrieval-based-Voice-Conversion.git
          echo "安装 Edge TTS..."
          pip install edge-tts

      # ---------- RVC 初始化（容错） ----------
      - name: 初始化 RVC 环境
        run: |
          echo "运行 rvc init（若失败则跳过）..."
          rvc init || python -m rvc.cli init || echo "初始化跳过，继续执行"
          mkdir -p assets/weights

      # ---------- 缓存角色模型 ----------
      - name: 缓存角色模型
        id: cache-pth
        uses: actions/cache@v4
        with:
          path: ./weights
          key: cerydra-pth-v1

      - name: 下载角色模型（若缓存未命中）
        if: steps.cache-pth.outputs.cache-hit != 'true'
        run: |
          mkdir -p weights
          echo "下载刻律德菈模型 (164MB)..."
          wget -q --show-progress -O ./weights/Cerydra_e20_s2400.pth \
            https://github.com/yingo-server/TextToSpeak/releases/download/cerydra/Cerydra_e20_s2400.pth
          ls -lh ./weights/Cerydra_e20_s2400.pth

      - name: 验证并复制模型到规范目录
        run: |
          if [ -f ./weights/Cerydra_e20_s2400.pth ]; then
            cp ./weights/Cerydra_e20_s2400.pth assets/weights/
          else
            echo "错误：模型文件不存在" && exit 1
          fi

      # ---------- 缓存 RVC 内部缓存（含 ONNX） ----------
      - name: 缓存 RVC 内部缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/rvc
          key: rvc-cache-v1

      # ---------- 生成 TTS 干声并标准化 ----------
      - name: 用 Edge TTS 生成干声
        run: |
          echo "生成 TTS 干声（文字：败者成灰，胜者为王）..."
          edge-tts --text "败者成灰，胜者为王" --write-media ./input.raw.wav
          # 重采样为标准格式（16kHz 单声道），提高兼容性
          ffmpeg -i ./input.raw.wav -ar 16000 -ac 1 ./input.wav -y
          echo "干声文件信息："
          ls -lh ./input.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 ./input.wav | xargs -I {} echo "时长：{} 秒"

      # ---------- 运行 RVC 推理 ----------
      - name: 运行 RVC 转换
        run: |
          echo "=== 开始 RVC 转换 ==="
          START_TIME=$(date +%s)
          echo "模型：assets/weights/Cerydra_e20_s2400.pth"
          echo "输入：./input.wav"
          echo "音高提取：rmvpe（自动 ONNX 加速）"
          echo "推理中，约 3-6 分钟..."

          export CUDA_VISIBLE_DEVICES=""

          # 统一使用 python -m rvc.cli 方式，避免命令查找问题
          python -m rvc.cli infer \
            --model_path assets/weights/Cerydra_e20_s2400.pth \
            --input_path ./input.wav \
            --output_path ./output.wav \
            --f0_method rmvpe \
            --protect 0.33 \
            --f0_up_key 0

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "推理完成，耗时：${DURATION} 秒 ($((DURATION/60)) 分 $((DURATION%60)) 秒)"

      # ---------- 检查输出并转码为 MP3 ----------
      - name: 转码为 MP3
        run: |
          if [ ! -f ./output.wav ]; then
            echo "错误：推理未生成输出文件" && exit 1
          fi
          echo "转换 WAV 为 MP3..."
          ffmpeg -i ./output.wav -codec:a libmp3lame -q:a 2 ./output.mp3 -y
          ls -lh ./output.mp3

      # ---------- 生成版本号（含时间戳） ----------
      - name: 生成版本号
        id: version
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          VERSION="[BOT][$TIMESTAMP][败者成灰，胜者为王]"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "Release 标题：$VERSION"
          # Tag 包含时间戳，确保每个版本独立
          echo "TAG=output-$TIMESTAMP" >> $GITHUB_ENV

      # ---------- 发布新 Release（不覆盖历史） ----------
      - name: 创建 Release
        run: |
          echo "创建 Release（Tag: ${{ env.TAG }}）..."
          gh release create "${{ env.TAG }}" \
            ./output.mp3 \
            --title "${{ env.VERSION }}" \
            --notes "自动生成于 $(date '+%Y-%m-%d %H:%M:%S')\n文字：败者成灰，胜者为王\n模型：刻律德菈 (无.index)\n引擎：官方 RVC CLI (CPU)\n加速：自动 ONNX" \
            --target ${{ github.sha }}
          echo "Release 创建成功！"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
