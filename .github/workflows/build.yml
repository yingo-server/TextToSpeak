name: 生成黄泉角色语音并发布

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 打印系统信息
        run: |
          echo "=== 系统信息 ==="
          uname -a
          lscpu | grep -E "Model name|Socket|Core|Thread"
          free -h
          df -h .

      # ---------- APT 缓存 ----------
      - name: 缓存 APT 软件包
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-v3

      - name: 安装系统依赖（含 FFmpeg 开发库）
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg git \
            libsndfile1 libsox-dev \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libavfilter-dev libswscale-dev libswresample-dev \
            pkg-config

      # ---------- Python 环境 ----------
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v3

      - name: 安装官方 RVC CLI（CPU 版）及 Edge TTS
        run: |
          echo "安装 CPU 版 PyTorch..."
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          echo "安装官方 RVC CLI..."
          pip install git+https://github.com/RVC-Project/Retrieval-based-Voice-Conversion.git
          echo "安装 Edge TTS..."
          pip install edge-tts
          rvc --version || true

      # ---------- RVC 初始化 ----------
      - name: 初始化 RVC 环境
        run: |
          rvc init || echo "rvc init 跳过"
          mkdir -p assets/weights

      # ---------- 缓存模型文件 ----------
      - name: 缓存角色模型
        id: cache-pth
        uses: actions/cache@v4
        with:
          path: ./weights
          key: huangquan-pth-v1

      - name: 下载并校验 .pth 模型
        if: steps.cache-pth.outputs.cache-hit != 'true'
        run: |
          mkdir -p weights
          echo "下载黄泉模型 (huangquan.pth)..."
          wget -q --show-progress -O ./weights/huangquan.pth \
            https://github.com/yingo-server/TextToSpeak/releases/download/%E9%BB%84%E6%B3%89/huangquan.pth
          python -c "
          import torch
          try:
              ckpt = torch.load('./weights/huangquan.pth', map_location='cpu')
              print('模型加载成功，keys:', list(ckpt.keys()))
          except Exception as e:
              print('模型加载失败:', e)
              exit(1)
          "
          echo "模型校验通过"

      - name: 下载并校验 .index 文件
        if: steps.cache-pth.outputs.cache-hit != 'true'
        run: |
          echo "下载黄泉索引文件..."
          wget -q --show-progress -O ./weights/huangquan.index \
            https://github.com/yingo-server/TextToSpeak/releases/download/%E9%BB%84%E6%B3%89/added_IVF1982_Flat_nprobe_1_default_exp_name_v2.index
          if [ ! -f ./weights/huangquan.index ]; then
            echo "错误：索引文件下载失败" && exit 1
          fi
          SIZE=$(stat -c%s ./weights/huangquan.index)
          echo "索引文件大小: $SIZE 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "错误：索引文件大小异常" && exit 1
          fi
          echo "索引文件校验通过"

      - name: 复制模型和索引到规范目录
        run: |
          cp ./weights/huangquan.pth assets/weights/
          cp ./weights/huangquan.index assets/weights/

      # ---------- 缓存 RVC 内部缓存 ----------
      - name: 缓存 RVC 内部缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/rvc
          key: rvc-cache-v1

      # ---------- 生成 TTS 干声 ----------
      - name: 用 Edge TTS 生成干声
        run: |
          echo "生成 TTS 干声（文字：败者成灰，胜者为王）..."
          edge-tts --text "败者成灰，胜者为王" --write-media ./input.raw.wav
          ffmpeg -i ./input.raw.wav -ar 16000 -ac 1 ./input.wav -y
          ls -lh ./input.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 ./input.wav | xargs -I {} echo "时长：{} 秒"

      # ---------- RVC 推理（使用 -if 指定索引） ----------
      - name: 运行 RVC 转换
        run: |
          echo "=== 开始 RVC 转换 ==="
          START_TIME=$(date +%s)
          export CUDA_VISIBLE_DEVICES=""

          # 使用 -if 指定索引文件
          rvc infer -m assets/weights/huangquan.pth \
                    -i ./input.wav \
                    -o ./output.wav \
                    -if assets/weights/huangquan.index \
                    -fm rmvpe \
                    -p 0.33 \
                    -fu 0

          END_TIME=$(date +%s)
          echo "推理完成，耗时：$((END_TIME - START_TIME)) 秒"

      # ---------- 转码为 MP3 ----------
      - name: 转码为 MP3
        run: |
          if [ ! -f ./output.wav ]; then
            echo "错误：推理未生成输出文件" && exit 1
          fi
          ffmpeg -i ./output.wav -codec:a libmp3lame -q:a 2 ./output.mp3 -y
          ls -lh ./output.mp3

      # ---------- 发布 Release ----------
      - name: 生成版本号
        id: version
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          echo "VERSION=[BOT][$TIMESTAMP][败者成灰，胜者为王]" >> $GITHUB_ENV
          echo "TAG=output-$TIMESTAMP" >> $GITHUB_ENV

      - name: 创建 Release
        run: |
          gh release create "${{ env.TAG }}" \
            ./output.mp3 \
            --title "${{ env.VERSION }}" \
            --notes "自动生成于 $(date '+%Y-%m-%d %H:%M:%S')\n文字：败者成灰，胜者为王\n模型：黄泉 (含 .index)\n引擎：官方 RVC CLI (CPU)\n加速：自动 ONNX" \
            --target ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
