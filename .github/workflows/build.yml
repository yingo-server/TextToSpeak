name: 生成角色语音并发布（最终稳定版）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 打印系统信息
        run: |
          echo "=== 系统信息 ==="
          uname -a
          lscpu | grep -E "Model name|Socket|Core|Thread"
          free -h
          df -h .

      - name: 缓存 APT 软件包
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-v1

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install ffmpeg git -y

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v1

      - name: 安装 Python 基础依赖（CPU PyTorch + ONNX + Edge TTS）
        run: |
          echo "安装 CPU 版 PyTorch..."
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          echo "安装 ONNX Runtime、Edge TTS、torchcrepe、soundfile、librosa..."
          pip install edge-tts onnxruntime torchcrepe soundfile librosa

      - name: 克隆 RVC-WebUI 仓库
        run: |
          echo "克隆官方 RVC 引擎..."
          git clone --depth=1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git rvc-webui
          cd rvc-webui
          echo "仓库克隆完成，大小："
          du -sh .

      - name: 安装 RVC 依赖（解决 omegaconf 冲突）
        run: |
          cd rvc-webui
          # 降级 pip 以兼容旧版 omegaconf 元数据
          pip install pip==23.3.1
          # 移除 torch 和 torchvision 行（已安装 CPU 版）
          sed -i '/^torch/d' requirements.txt
          sed -i '/^torchvision/d' requirements.txt
          # 移除 onnxruntime-gpu（改用 CPU 版）
          sed -i '/^onnxruntime-gpu/d' requirements.txt
          # 安装依赖
          pip install -r requirements.txt
          # 额外安装可能缺失的包
          pip install torchcrepe fairseq

      - name: 下载 RMVPE ONNX 模型
        run: |
          mkdir -p rvc-webui/assets
          echo "下载 rmvpe.onnx ..."
          wget -q --show-progress -O rvc-webui/assets/rmvpe.onnx \
            https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.onnx
          ls -lh rvc-webui/assets/rmvpe.onnx

      - name: 缓存角色模型
        id: cache-pth
        uses: actions/cache@v4
        with:
          path: ./weights
          key: cerydra-pth-v1

      - name: 下载角色模型（若缓存未命中）
        if: steps.cache-pth.outputs.cache-hit != 'true'
        run: |
          mkdir -p weights
          echo "下载刻律德菈模型 (164MB)..."
          wget -q --show-progress -O ./weights/Cerydra_e20_s2400.pth \
            https://github.com/yingo-server/TextToSpeak/releases/download/cerydra/Cerydra_e20_s2400.pth
          ls -lh ./weights/Cerydra_e20_s2400.pth

      - name: 缓存 ONNX 量化模型
        uses: actions/cache@v4
        with:
          path: ./onnx_cache
          key: cerydra-onnx-v1

      - name: 生成自定义推理脚本
        run: |
          cat > rvc-webui/run_infer.py << 'EOF'
          import sys
          import os
          sys.path.append(os.path.dirname(os.path.abspath(__file__)))
          from configs.config import Config
          from infer.modules.vc.modules import VC

          def main():
              model_path = sys.argv[1]
              input_path = sys.argv[2]
              output_path = sys.argv[3]
              f0_method = sys.argv[4] if len(sys.argv) > 4 else "rmvpe"

              config = Config()
              # 设置权重目录为上级目录的 weights
              config.weight_root = os.path.abspath("../weights")
              config.onnx_dir = os.path.abspath("../onnx_cache")
              config.use_onnx = True
              os.makedirs(config.weight_root, exist_ok=True)
              os.makedirs(config.onnx_dir, exist_ok=True)

              vc = VC(config)
              sid = 0
              vc.get_vc(sid)  # 加载模型

              # 推理参数（默认值）
              vc_transform = 0
              f0_file = None
              file_index = ""
              file_index2 = ""
              index_rate = 0.75
              filter_radius = 3
              resample_sr = 0
              rms_mix_rate = 0.25
              protect = 0.33

              info, audio_data = vc.vc_single(
                  sid, input_path, vc_transform, f0_file, f0_method,
                  file_index, file_index2, index_rate, filter_radius,
                  resample_sr, rms_mix_rate, protect
              )
              print(info)
              # 保存音频
              if isinstance(audio_data, tuple) and len(audio_data) == 2:
                  sr, audio = audio_data
                  import soundfile as sf
                  sf.write(output_path, audio, sr)
              else:
                  import shutil
                  shutil.copy(audio_data, output_path)
              print("转换完成，输出：", output_path)

          if __name__ == "__main__":
              main()
          EOF
          echo "自定义脚本已生成"

      - name: 用 Edge TTS 生成干声
        run: |
          echo "生成 TTS 干声（文字：败者成灰，胜者为王）..."
          edge-tts --text "败者成灰，胜者为王" --write-media ./input.wav
          echo "干声文件信息："
          ls -lh ./input.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 ./input.wav | xargs -I {} echo "时长：{} 秒"

      - name: 运行 RVC 转换（自定义脚本）
        run: |
          echo "=== 开始 RVC 转换 ==="
          START_TIME=$(date +%s)
          echo "模型：./weights/Cerydra_e20_s2400.pth"
          echo "输入：./input.wav"
          echo "ONNX 缓存：./onnx_cache"
          echo "音高提取：rmvpe (ONNX)"
          echo "推理中，约 5-10 分钟..."

          cd rvc-webui
          python run_infer.py ../weights/Cerydra_e20_s2400.pth ../input.wav ../output.mp3 rmvpe
          cd ..

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "转换完成，总耗时：${DURATION} 秒 ($((DURATION/60)) 分 $((DURATION%60)) 秒)"
          ls -lh ./output.mp3

      - name: 生成版本号
        id: version
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          VERSION="[BOT][$TIMESTAMP][败者成灰，胜者为王]"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "Release 标题：$VERSION"

      - name: 删除旧的 Release（tag=output）
        continue-on-error: true
        run: |
          echo "清理旧 Release..."
          gh release delete output --yes || true
          git push origin :refs/tags/output || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Release
        run: |
          echo "创建新 Release..."
          gh release create output \
            ./output.mp3 \
            --title "${{ env.VERSION }}" \
            --notes "自动生成于 $(date '+%Y-%m-%d %H:%M:%S')\n文字：败者成灰，胜者为王\n模型：刻律德菈 (无.index)\n引擎：RVC-WebUI 官方版\n量化：ONNX 加速 (自定义脚本)" \
            --target ${{ github.sha }}
          echo "Release 创建成功！"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
