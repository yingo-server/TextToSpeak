name: 生成黄泉角色语音并发布 (48k)

on:
  workflow_dispatch:
    inputs:
      text:
        description: '要合成的台词文本'
        required: true
        default: '败者成灰，胜者为王'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 打印系统信息
        run: |
          echo "=== 系统信息 ==="
          uname -a
          lscpu | grep -E "Model name|Socket|Core|Thread"
          free -h
          df -h .

      # ---------- APT 缓存 ----------
      - name: 缓存 APT 软件包
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-v3

      - name: 安装系统依赖（含 FFmpeg 开发库和 sox）
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg git sox \
            libsndfile1 libsox-dev \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libavfilter-dev libswscale-dev libswresample-dev \
            pkg-config

      # ---------- Python 环境 ----------
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v3

      - name: 安装官方 RVC CLI（CPU 版）及 Edge TTS
        run: |
          echo "安装 CPU 版 PyTorch..."
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          echo "安装官方 RVC CLI（固定 commit，避免上游变更）..."
          RVC_COMMIT="7b284a634667c34103eaaeed972b48ccdb4b893e"
          pip install git+https://github.com/RVC-Project/Retrieval-based-Voice-Conversion.git@${RVC_COMMIT}
          echo "安装 Edge TTS..."
          pip install edge-tts
          rvc --version || true

      # ---------- RVC 初始化 ----------
      - name: 初始化 RVC 环境
        run: |
          rvc init || echo "rvc init 跳过"
          mkdir -p assets/weights

      # ---------- 缓存 RVC 内部缓存（含 Hubert、ONNX 等）提前恢复 ----------
      - name: 缓存 RVC 内部缓存
        id: rvc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rvc
          key: rvc-cache-v2

      # ---------- 仅当缓存未命中时下载 Hubert 模型 ----------
      - name: 下载 Hubert 模型（仅在缓存未命中时）
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          echo "首次运行，下载 Hubert 模型（约 300MB）..."
          python -c "from rvc.lib.tools.prerequisites import download_hubert; download_hubert()"
          echo "Hubert 模型下载完成"

      # ---------- 缓存角色模型 ----------
      - name: 缓存角色模型
        id: cache-pth
        uses: actions/cache@v4
        with:
          path: ./weights
          key: huangquan-pth-v1

      - name: 下载并校验 .pth 模型
        if: steps.cache-pth.outputs.cache-hit != 'true'
        run: |
          mkdir -p weights
          echo "下载黄泉模型 (huangquan.pth)..."
          wget -q --show-progress -O ./weights/huangquan.pth \
            https://github.com/yingo-server/TextToSpeak/releases/download/%E9%BB%84%E6%B3%89/huangquan.pth
          python -c "
          import torch
          try:
              ckpt = torch.load('./weights/huangquan.pth', map_location='cpu')
              print('模型加载成功，keys:', list(ckpt.keys()))
          except Exception as e:
              print('模型加载失败:', e)
              exit(1)
          "
          echo "模型校验通过"

      - name: 下载并校验 .index 文件
        if: steps.cache-pth.outputs.cache-hit != 'true'
        run: |
          echo "下载黄泉索引文件..."
          wget -q --show-progress -O ./weights/huangquan.index \
            https://github.com/yingo-server/TextToSpeak/releases/download/%E9%BB%84%E6%B3%89/added_IVF1982_Flat_nprobe_1_default_exp_name_v2.index
          if [ ! -f ./weights/huangquan.index ]; then
            echo "错误：索引文件下载失败" && exit 1
          fi
          SIZE=$(stat -c%s ./weights/huangquan.index)
          echo "索引文件大小: $SIZE 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "错误：索引文件大小异常" && exit 1
          fi
          echo "索引文件校验通过"

      - name: 复制模型和索引到规范目录
        run: |
          cp ./weights/huangquan.pth assets/weights/
          cp ./weights/huangquan.index assets/weights/

      # ---------- 生成 TTS 干声并标准化为 48k 单声道 ----------
      - name: 用 Edge TTS 生成干声
        env:
          TEXT: ${{ inputs.text }}
        run: |
          echo "生成 TTS 干声（文字：${TEXT}）..."
          # 防御换行符：只取第一行，避免命令截断
          SAFE_TEXT=$(echo "$TEXT" | head -n 1)
          edge-tts --text "${SAFE_TEXT}" --write-media ./input.raw.wav
          ffmpeg -i ./input.raw.wav -ar 48000 -ac 1 ./input.wav -y
          echo "干声文件信息："
          ls -lh ./input.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 ./input.wav | xargs -I {} echo "时长：{} 秒"

      # ---------- RVC 推理 ----------
      - name: 运行 RVC 转换
        run: |
          echo "=== 开始 RVC 转换 ==="
          START_TIME=$(date +%s)
          export CUDA_VISIBLE_DEVICES=""

          # 注意：-p 0.33 为微变调（0.33 半音），可改为 0 保持原调
          rvc infer -m assets/weights/huangquan.pth \
                    -i ./input.wav \
                    -o ./output.wav \
                    -if assets/weights/huangquan.index \
                    -fm rmvpe \
                    -p 0.33 \
                    -fu 0

          END_TIME=$(date +%s)
          echo "推理完成，耗时：$((END_TIME - START_TIME)) 秒"

      # ---------- 检查输出并转码为 MP3 ----------
      - name: 转码为 MP3
        run: |
          if [ ! -f ./output.wav ] || [ ! -s ./output.wav ]; then
            echo "错误：推理未生成有效的输出文件" && exit 1
          fi
          echo "转换 WAV 为 MP3..."
          ffmpeg -i ./output.wav -codec:a libmp3lame -q:a 2 ./output.mp3 -y
          ls -lh ./output.mp3

      # ---------- 生成版本号（Tag 安全字符过滤） ----------
      - name: 生成版本号
        env:
          TEXT: ${{ inputs.text }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          # 过滤非法字符：只保留字母、数字、短横线、下划线
          TEXT_SUFFIX=$(echo "$TEXT" | tr -cd '[:alnum:]_-' | head -c 16)
          # 若过滤后为空，使用默认值
          [ -z "$TEXT_SUFFIX" ] && TEXT_SUFFIX="voice"
          echo "VERSION=[BOT][$TIMESTAMP][$TEXT]" >> $GITHUB_ENV
          echo "TAG=output-$TIMESTAMP-$TEXT_SUFFIX" >> $GITHUB_ENV

      # ---------- 发布 Release（使用 notes 文件避免字符转义） ----------
      - name: 创建 Release
        env:
          TAG: ${{ env.TAG }}
          VERSION: ${{ env.VERSION }}
          TEXT: ${{ inputs.text }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.txt << 'EOF'
          自动生成于 $(date '+%Y-%m-%d %H:%M:%S')
          文字：$TEXT
          模型：黄泉 (48k, 含 .index)
          引擎：官方 RVC CLI (CPU)
          加速：自动 ONNX
          EOF
          # 展开变量
          envsubst < notes.txt > notes_expanded.txt
          gh release create "$TAG" \
            ./output.mp3 \
            --title "$VERSION" \
            --notes-file notes_expanded.txt \
            --target ${{ github.sha }}
